<style>
/* Acesso restrito: tela de login sóbria no azul-marinho da marca; o índice só existe depois de descriptografado. */
:root {
  --bg: #061019;
  --panel: #0C1822;
  --line: rgba(255,255,255,.12);
  --text: #EAF2F7;
  --muted: #8A9BA8;
  --cyan: #0BBBEF;
  --blue: #008BD2;
  --err: #FF6B72;
  --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body { font-family: var(--sans); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
  background-image: linear-gradient(rgba(11,187,239,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(11,187,239,.06) 1px, transparent 1px);
  background-size: 48px 48px; mask-image: radial-gradient(80% 70% at 70% 30%, #000 0%, transparent 75%); -webkit-mask-image: radial-gradient(80% 70% at 70% 30%, #000 0%, transparent 75%); }
.wrap { position: relative; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 32px 20px; }
.logo { height: 34px; width: auto; fill: var(--text); display: block; align-self: flex-start; }
.card { width: min(100%, 420px); display: flex; flex-direction: column; gap: 28px; }
.card h1 { font-size: 26px; font-weight: 600; letter-spacing: -.01em; }
.card p.lead { color: var(--muted); font-size: 15px; line-height: 1.5; margin-top: 8px; }
form { display: flex; flex-direction: column; gap: 16px; }
label { display: flex; flex-direction: column; gap: 8px; font: 500 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
input[type=text], input[type=password] { height: 52px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: 400 16px var(--sans); transition: border-color .2s; }
input:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(11,187,239,.18); }
.row { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.row input { width: 18px; height: 18px; accent-color: var(--cyan); }
button.go { height: 54px; border: 0; border-radius: 6px; background: var(--cyan); color: #04121B; font: 600 15px var(--sans); letter-spacing: .02em; cursor: pointer; transition: filter .2s, opacity .2s; }
button.go:hover { filter: brightness(1.08); }
button.go:disabled { opacity: .6; cursor: progress; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
.msg { min-height: 20px; font-size: 14px; color: var(--err); }
.foot { font: 400 12px/1.5 var(--mono); color: var(--muted); letter-spacing: .04em; }

/* índice (depois do login) */
.hub { width: min(100%, 1100px); display: none; flex-direction: column; gap: 36px; }
.hub.on { display: flex; }
.card.off { display: none; }
.hub header { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.hub h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 600; letter-spacing: -.02em; }
.hub .sub { color: var(--muted); margin-top: 8px; font-size: 16px; }
.out { height: 42px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--text); font: 500 13px var(--mono); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
.out:hover { border-color: var(--cyan); color: var(--cyan); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.prop { display: flex; flex-direction: column; gap: 14px; padding: 26px; min-height: 240px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: inherit; text-decoration: none; transition: border-color .2s, transform .2s; }
.prop:hover { border-color: var(--cyan); transform: translateY(-3px); }
.prop .k { font: 500 13px var(--mono); letter-spacing: .14em; color: var(--cyan); text-transform: uppercase; }
.prop h2 { font-size: 26px; font-weight: 600; letter-spacing: -.01em; }
.prop p { color: var(--muted); font-size: 15px; line-height: 1.5; }
.prop .open { margin-top: auto; font: 500 13px var(--mono); letter-spacing: .1em; text-transform: uppercase; }
.swatch { height: 6px; border-radius: 3px; }
</style>
</head>
