    .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: all.slice(0, 12) }, key, all.slice(12)); })
    .then(function (buf) {
      var html = new TextDecoder().decode(buf);
      html = html.replace(/(["'(])media\//g, '$1../media/');
      var t = /<title>([^<]*)<\/title>/i.exec(html);
      document.open(); document.write(html); document.close();
      if (t) document.title = t[1].replace(/&amp;/g, '&');
    })
    .catch(function () {
      try { sessionStorage.removeItem('xone-k'); localStorage.removeItem('xone-k'); } catch (e) {}
      toLogin();
    });
})();
</script>
